  </head><body class="bg-background font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-4 flex items-center shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="ml-2 font-headline-md text-headline-md text-on-surface truncate">Add Habit</h1><div class="ml-auto"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJLBLdgevkddOtlEHDCrUFxDz8UKSACAXze--39Fz2ivFZhRoDrN1mzGFcmrAplJ-OfY714fGpKx4nDyR_yLnM92ncpiGJVKOE0nXtCG7bDtzJfzrGM9V2B_RjiXJr5OGERgL--SAilPGxItipMOXU7S3VQUUISmA6jouoEV4yVjE53SbOffyu22dlNABTi5iyWxwGSBt-og5MXvLm75FeUYexCSaU3d7ayAvjRyhX6v7ffkEyz7Kh0A"></div></div></header><main class="relative w-full pt-16 bg-background min-h-screen"><div class="flex flex-col w-full pb-safe">
<!-- Content Container with natural scrolling and generous spacing -->
<div class="flex flex-col w-full px-container-margin gap-section-gap pb-32 pt-8">
<!-- Header -->
<div class="flex flex-col gap-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Plant a new habit</h2>
<p class="font-body-md text-body-md text-on-surface-variant">What would you like to nurture today?</p>
</div>
<!-- 1. Selection -->
<div class="flex flex-col gap-stack-gap">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Select a Seed</h3>
<div class="flex flex-wrap gap-3" id="habit-selection">
<button class="habit-chip flex-auto h-touch-target px-6 rounded-full bg-primary text-on-primary flex items-center justify-center gap-2 shadow-[0_8px_30px_rgba(77,96,84,0.12)] transition-all duration-300 active:scale-95" data-selected="true">
<span class="material-symbols-outlined text-[20px]">water_drop</span>
<span class="font-label-md text-label-md">Drink water</span>
</button>
<button class="habit-chip flex-auto h-touch-target px-6 rounded-full bg-surface-container text-on-surface flex items-center justify-center gap-2 transition-all duration-300 active:scale-95" data-selected="false">
<span class="material-symbols-outlined text-[20px]">sprint</span>
<span class="font-label-md text-label-md">Exercise</span>
</button>
<button class="habit-chip flex-auto h-touch-target px-6 rounded-full bg-surface-container text-on-surface flex items-center justify-center gap-2 transition-all duration-300 active:scale-95" data-selected="false">
<span class="material-symbols-outlined text-[20px]">self_improvement</span>
<span class="font-label-md text-label-md">Meditation</span>
</button>
<button class="habit-chip flex-auto h-touch-target px-6 rounded-full bg-surface-container text-on-surface flex items-center justify-center gap-2 transition-all duration-300 active:scale-95" data-selected="false">
<span class="material-symbols-outlined text-[20px]">menu_book</span>
<span class="font-label-md text-label-md">Read</span>
</button>
<button class="habit-chip flex-auto h-touch-target px-6 rounded-full bg-surface-container text-on-surface flex items-center justify-center gap-2 transition-all duration-300 active:scale-95" data-selected="false" id="btn-custom-habit">
<span class="material-symbols-outlined text-[20px]">edit</span>
<span class="font-label-md text-label-md">Custom</span>
</button>
</div>
<!-- Hidden Custom Input -->
<div class="hidden overflow-hidden transition-all duration-500 mt-2" id="custom-habit-input-container">
<input class="w-full h-touch-target px-6 rounded-full bg-surface-container-low text-on-surface font-body-lg text-body-lg placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-inner" placeholder="Name your habit..." type="text">
</div>
</div>
<!-- 2. Goal -->
<div class="flex flex-col gap-stack-gap">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Daily Goal</h3>
<div class="relative w-full">
<input class="w-full h-touch-target pl-12 pr-6 rounded-full bg-surface-container-low text-on-surface font-body-lg text-body-lg placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-inner" placeholder="e.g., 2 Liters, 10 minutes..." type="text">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">track_changes</span>
</div>
</div>
<!-- 3. Frequency -->
<div class="flex flex-col gap-stack-gap">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Rhythm</h3>
<div class="flex flex-wrap gap-3" id="frequency-selection">
<button class="freq-chip h-touch-target px-6 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-[0_8px_30px_rgba(77,96,84,0.12)] transition-all duration-300 active:scale-95" data-selected="true">Every day</button>
<button class="freq-chip h-touch-target px-6 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-all duration-300 active:scale-95" data-selected="false">Weekdays</button>
<button class="freq-chip h-touch-target px-6 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-all duration-300 active:scale-95" data-selected="false">Specific days</button>
</div>
</div>
<!-- 4. Reminder -->
<div class="flex flex-col gap-stack-gap">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Gentle Nudge</h3>
<div class="relative w-full">
<input class="w-full h-touch-target pl-12 pr-6 rounded-full bg-surface-container-low text-on-surface font-body-lg text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-inner appearance-none" type="time" value="08:00">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">notifications</span>
</div>
</div>
</div>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-4 pb-safe bg-gradient-to-t from-background via-background/90 to-transparent pt-12 z-10 pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<button class="w-full h-touch-target rounded-full bg-primary text-on-primary flex items-center justify-center gap-2 shadow-[0_12px_40px_rgba(77,96,84,0.25)] transition-all duration-300 hover:shadow-[0_16px_50px_rgba(77,96,84,0.3)] active:scale-[0.98]">
<span class="font-headline-md text-headline-md text-base">Confirm</span>
<span class="material-symbols-outlined text-[20px]">check</span>
</button>
</div>
</div>
</div>
<script>
  // Simple interactions to make the prototype feel alive
  const setupChips = (containerId, chipClass) => {
    const container = document.getElementById(containerId);
    const chips = container.querySelectorAll('.' + chipClass);
    
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        // Reset all chips in group
        chips.forEach(c => {
          c.setAttribute('data-selected', 'false');
          c.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_8px_30px_rgba(77,96,84,0.12)]');
          c.classList.add('bg-surface-container', 'text-on-surface');
        });
        
        // Activate clicked chip
        chip.setAttribute('data-selected', 'true');
        chip.classList.remove('bg-surface-container', 'text-on-surface');
        chip.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_8px_30px_rgba(77,96,84,0.12)]');

        // Handle specific logic for custom habit
        if(containerId === 'habit-selection') {
          const customContainer = document.getElementById('custom-habit-input-container');
          if(chip.id === 'btn-custom-habit') {
            customContainer.classList.remove('hidden');
            setTimeout(() => {
              customContainer.querySelector('input').focus();
            }, 50);
          } else {
            customContainer.classList.add('hidden');
          }
        }
      });
    });
  };

  setupChips('habit-selection', 'habit-chip');
  setupChips('frequency-selection', 'freq-chip');
</script></main>

</body></html>
